<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsten / MULTIPLAN</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --bad:#b3261e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 Ubuntu, "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; }
  /* start screen */
  .home { flex:1; overflow:auto; padding:12px; }
  .home h1 { font-size:15px; margin:0 0 12px; font-weight:600; }
  .home h1 b { color:var(--accent); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px 10px; background:#fff; border:1px solid var(--line);
    font:inherit; color:var(--ink); cursor:pointer; border-radius:0; text-align:center; }
  .tile:hover { border-color:var(--ink); box-shadow:inset 0 -3px 0 var(--accent); }
  .tile img { width:52px; height:52px; display:block; }
  .tile b { font-size:13px; font-weight:600; }
  .tile span { font-size:10.5px; color:var(--muted); line-height:1.25; }
  .tile.off { cursor:default; background:#f0eee9; }
  .tile.off img { filter:grayscale(1); opacity:.45; }
  .tile.off b, .tile.off span { color:#a7a39a; }
  .tile.off:hover { border-color:var(--line); box-shadow:none; }
  /* bar inside a tool */
  .bar { display:flex; align-items:center; gap:8px; padding:4px 8px; background:#fff; border-bottom:1px solid var(--line); }
  .bar button { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  .bar .nm { font-weight:600; font-size:12.5px; }
  .bar .brand { margin-left:auto; font-size:11px; color:var(--muted); }
  .status { font-size:12px; color:var(--muted); padding:8px 12px; }
  .status.bad { color:var(--bad); }
  .retry { margin:8px 12px; font:inherit; padding:5px 10px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  .frames { flex:1; position:relative; min-height:0; }
  .frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<div id="status" class="status">Connecting to Trimble Connect…</div>
<div class="home" id="home" hidden>
  <h1><b>Arsten</b> / MULTIPLAN</h1>
  <div class="tiles" id="tiles"></div>
</div>
<div class="bar" id="bar" hidden><button id="btnHome">⌂ Начало</button><span class="nm" id="barName"></span><span class="brand">Arsten / MULTIPLAN</span></div>
<div class="frames" id="frames"></div>
<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-access.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
