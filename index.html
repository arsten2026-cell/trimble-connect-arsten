<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsten / Multiplan</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --bad:#b3261e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 Ubuntu, "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; }
  /* start screen */
  .home { flex:1; overflow:auto; padding:12px; }
  .home h1 { font-size:15px; margin:0 0 12px; font-weight:600; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px 10px; background:#fff; border:1px solid var(--line);
    font:inherit; color:var(--ink); cursor:pointer; border-radius:0; text-align:center; }
  .tile:hover { border-color:var(--ink); box-shadow:inset 0 -3px 0 var(--accent); }
  .tile img { width:52px; height:52px; display:block; }
  .tile b { font-size:13px; font-weight:600; }
  .tile span { font-size:10.5px; color:var(--muted); line-height:1.25; }
  .tile.off { cursor:default; background:#f0eee9; }
  .tile.off img { filter:grayscale(1); opacity:.45; }
  .tile.off b, .tile.off span { color:#a7a39a; }
  .tile.off:hover { border-color:var(--line); box-shadow:none; }
  .tile i.for { font-style:normal; font-size:10px; color:var(--muted); line-height:1.2; border-top:1px solid var(--line); padding-top:4px; align-self:stretch; }
  .tile.off i.for { color:#a7a39a; }
  .tile.wait img { opacity:.6; }
  /* "Продължи: Стомана · Сграда А" (week 3 A4) */
  .resume { display:block; width:100%; margin:0 0 10px; padding:9px 12px; font:inherit; font-size:13px; font-weight:600; text-align:left;
    background:var(--ink); color:#fff; border:1px solid var(--ink); border-left:4px solid var(--accent); border-radius:0; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .resume:disabled { background:#f0eee9; color:#a7a39a; border-color:var(--line); border-left-color:var(--line); cursor:default; }
  @media (pointer: coarse) { .resume { min-height:44px; font-size:14px; } .tile { min-height:44px; }
    /* sweep 18.11.2026: the bar the user taps most was ~22 px high on phones */
    .bar button, .sthead button, .form button, .late button { min-height:40px; font-size:14px; padding:6px 12px; }
    .hhead select { min-height:40px; font-size:14px; } }
  /* start screen header: title + BG/EN switch (sweep 18.11.2026) */
  .hhead { display:flex; align-items:center; gap:8px; margin:0 0 12px; }
  .hhead h1 { margin:0; flex:1; min-width:0; }
  .hhead select { font:inherit; font-size:12px; padding:2px 4px; border:1px solid var(--line); background:#fff; border-radius:0; }
  /* "Как се работи": short help on the start screen, one topic per tile (sweep 18.11.2026) */
  .hlink { font:inherit; font-size:12px; color:var(--ink); background:none; border:0; padding:4px 0; cursor:pointer; text-decoration:underline; white-space:nowrap; }
  .help { background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); padding:6px 10px; margin:0 0 10px; font-size:12.5px; }
  .help details { border-bottom:1px solid var(--line); padding:4px 0; }
  .help details:last-of-type { border-bottom:0; }
  .help summary { cursor:pointer; font-weight:600; padding:4px 0; }
  .help ol { margin:4px 0 4px; padding-left:20px; }
  .help li { margin:2px 0; }
  .help .more { color:var(--muted); font-size:11.5px; margin-top:6px; }
  @media (pointer: coarse) { .hlink { min-height:40px; font-size:14px; } .help summary { min-height:36px; } }
  /* a tool frame that did not connect within 20 s (sweep 18.11.2026) */
  .late { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 8px; background:#fff; border-bottom:1px solid var(--line); color:var(--bad); font-size:12.5px; }
  .late button { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  /* "Копирай диагностика": a small text link at the bottom of the start screen, not a main action (sweep 18.11.2026) */
  .foot { padding:4px 12px 8px; text-align:right; }
  .foot .link { font:inherit; font-size:12px; color:var(--muted); background:none; border:0; padding:4px 0; cursor:pointer; text-decoration:underline; }
  /* bar inside a tool */
  .bar { display:flex; align-items:center; gap:8px; padding:4px 8px; background:#fff; border-bottom:1px solid var(--line); }
  .bar button { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  .bar button { white-space:nowrap; flex:none; }
  .bar .nm { font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  .bar .stg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  .bar .brand { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; }
  .bar #btnStage { margin-left:auto; }
  .bar #btnStage + .brand { margin-left:0; }
  @media (max-width: 420px) { .bar .brand { display:none; } }
  .bar .sec { background:transparent; color:var(--ink); border-color:var(--line); }
  .bar .stg { font-size:12px; color:var(--accent); font-weight:600; }
  /* stages */
  .sthead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sthead button, .form button { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  .sthead button.sec, .form button.sec { background:transparent; color:var(--ink); border-color:var(--line); }
  .sthead b { font-size:14px; }
  .tile.stage { position:relative; }
  .tile.stage .ed { position:absolute; top:3px; right:5px; font-size:13px; color:var(--muted); padding:2px 4px; }
  .tile.stage .ed:hover { color:var(--accent); }
  .tile.add { border-style:dashed; color:var(--muted); }
  .tile.add .plus { font-size:30px; line-height:52px; height:52px; color:var(--accent); }
  .tile.cur .plus { font-size:24px; line-height:52px; height:52px; color:var(--muted); }
  .form { background:#fff; border:1px solid var(--line); padding:10px; margin-top:10px; }
  .form label { display:block; font-size:12px; margin:6px 0 2px; color:var(--muted); }
  .form input[type=text], .form select { font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--line); width:100%; border-radius:0; background:#fff; }
  .form .opts { max-height:180px; overflow:auto; border:1px solid var(--line); padding:4px 6px; }
  .form .opts label { display:flex; gap:6px; align-items:center; margin:2px 0; color:var(--ink); }
  .form .opts.tree { max-height:320px; }
  .form .tree details > summary { cursor:pointer; padding:2px 0; font-size:12.5px; list-style:revert; }
  .form .tree .kids { padding-left:16px; border-left:1px solid var(--line); margin-left:5px; }
  .form .row { display:flex; gap:12px; }
  .form .row label { display:inline-flex; gap:4px; align-items:center; color:var(--ink); }
  .form .acts { display:flex; gap:6px; margin-top:10px; }
  .form .acts .del { margin-left:auto; background:#b3261e; border-color:#b3261e; }
  .sub { grid-column:1 / -1; font-size:12px; color:var(--muted); margin-top:6px; }
  .sub.bad { color:var(--bad); }
  .status { font-size:12px; color:var(--muted); padding:8px 12px; }
  .status.bad { color:var(--bad); }
  .frames { flex:1; position:relative; min-height:0; }
  .frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<div id="status" class="status">Trimble Connect…</div>
<div class="home" id="home" hidden>
  <div class="hhead"><h1>Arsten / Multiplan</h1><!-- one name for both companies, none first (sweep 18.11.2026) -->
    <button type="button" class="hlink" id="btnHelp" aria-expanded="false" aria-controls="help">Как се работи</button>
    <select id="selLang" title="Language / Език"><option value="bg">BG</option><option value="en">EN</option></select></div>
  <div class="help" id="help" hidden></div>
  <button class="resume" id="btnResume" hidden></button>
  <div class="tiles" id="tiles"></div>
</div>
<div class="home" id="stages" hidden>
  <div class="sthead"><button id="btnStHome">⌂ Начало</button><b id="stTitle"></b></div>
  <div class="tiles" id="stTiles"></div>
  <div class="form" id="stForm" hidden></div>
</div>
<div class="bar" id="bar" hidden><button id="btnHome">⌂ Начало</button><span class="nm" id="barName"></span><span class="stg" id="barStage"></span>
  <button class="sec" id="btnStage">Етапи</button><span class="brand">Arsten / Multiplan</span></div>
<div class="late" id="late" hidden><span id="lateText">Инструментът не се зареди.</span> <button id="btnRetry">Опитай пак</button></div>
<div class="frames" id="frames"></div>
<div class="foot" id="foot"><button type="button" class="link" data-arsten-diag>Копирай диагностика</button></div>
<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-perf.js?v=21f7454938"></script>
<script src="arsten-diag.js?v=bb0c6351fe"></script>
<script src="arsten-i18n.js?v=c58f01c9fc"></script>
<script src="arsten-access.js?v=fad565fcbe"></script>
<script src="psetapi.js?v=970df94af2"></script>
<script src="stages.js?v=c5f13f90f8"></script>
<script src="home.js?v=fa94f212dc"></script>
<script src="app.js?v=5dc5ca62eb"></script>
</body>
</html>
