<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsten</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --bad:#b3261e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 Ubuntu, "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; }
  .top { display:flex; align-items:flex-end; gap:6px; padding:4px 6px 0; border-bottom:1px solid var(--line); background:#fff; }
  .brand { font-weight:700; font-size:14px; color:var(--accent); padding:0 2px 5px; }
  /* one row; scrolls sideways when the side panel is narrow */
  .tabs { display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:thin; }
  .tabs button { flex:none; font:inherit; font-size:12px; padding:4px 8px; border:1px solid var(--line); border-bottom:0; background:var(--bg); color:var(--ink); cursor:pointer; border-radius:0; white-space:nowrap; }
  .tabs button.on { background:#fff; border-color:var(--ink); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent); }
  .retry { margin:8px 12px; font:inherit; padding:5px 10px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  .status { font-size:12px; color:var(--muted); padding:8px 12px; }
  .status.bad { color:var(--bad); }
  .frames { flex:1; position:relative; min-height:0; }
  .frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<div class="top"><span class="brand" title="Arsten">A</span><div class="tabs" id="tabs"></div></div>
<div id="status" class="status">Connecting to Trimble Connect…</div>
<div class="frames" id="frames"></div>
<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-access.js?v=10"></script>
<script src="app.js?v=5"></script>
</body>
</html>
